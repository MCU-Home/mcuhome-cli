#
# Test gate for the mcuhome command line: one job per wrapper in
# scripts/test.d/ (today just pytest), plus a pre-check that every
# wrapper has a job here.
#
# test-pytest needs the workbench (mcu-home/mcuhome-workbench), the
# device model and the code generator from mcu-home/mcuhome-sdk, and the
# package-registry verifier the workbench imports
# (mcu-home/mcuhome-packagetool) — all public siblings, plain checkouts,
# no deploy keys. Once the packages are published this becomes a plain
# pip install.
#
# All actions are pinned to commit SHAs, not tags.

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-gates:
    name: Check gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/test check-ci
        run: scripts/test check-ci

  test-pytest:
    name: Test (pytest)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the device model and the code generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout the workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      # The workbench imports mcuhome.packagetool.
      - name: Checkout the package registry verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-packagetool
          path: .deps/mcuhome-packagetool

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        # One namespace, three repositories: model and compiler from
        # mcuhome-sdk/packaging, the workbench from the root of
        # mcuhome-workbench, the registry verifier from the root of
        # mcuhome-packagetool. One invocation, so pip resolves the
        # sibling pins against the copies being installed rather than
        # against an index. The [generate] extra's compiler pin is
        # satisfied by the sdk copy on the same command line, and the
        # [remote] extra brings the session client the `remote` build
        # target needs. Installed
        # into this job's own .venv — scripts/test selects it itself.
        # The dev tools are a PEP 735 dependency group (--group dev),
        # which needs pip >= 25.1; upgrade first.
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check \
            ./.deps/mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-packagetool \
            './.deps/mcuhome-workbench[remote,generate]' \
            ./.deps/mcuhome-sdk/packaging/compiler
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      - name: scripts/test pytest
        run: scripts/test pytest
