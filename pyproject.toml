[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The plain name, on purpose (ADR 0020 decision 2): `pip install
# mcuhome` should yield the command a user expects, and no other package
# has a better claim to it — the library ships as mcuhome-model,
# mcuhome-workbench and mcuhome-compiler, the services as
# mcuhome-ui and mcuhome-buildserver.
name = "mcuhome-cli"
version = "0.1.0.dev0"
description = "The mcuhome command line: a thin shell over the MCUHome builder library."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = [
  "zephyr",
  "matter",
  "thread",
  "home-assistant",
  "firmware",
  "esphome-alternative",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
# The one dependency, on purpose: this package is the command shell of
# the library family and adds no behavior of its own. The workbench is
# the API the shell actually talks to, so it is the declared dependency
# (cli ADR 0002); its extras pull the compiler for the local build
# methods and the session client for remote. None of them is published
# yet — see the README for the dev install.
dependencies = ["mcuhome-workbench[generate,remote]"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome-cli"
Issues = "https://github.com/mcu-home/mcuhome-cli/issues"

[project.scripts]
mcuhome = "mcuhome.cli.main:main"

[tool.hatch.build.targets.wheel]
only-include = ["mcuhome/cli"]

# Same ruff settings as the mcuhome repository; bump the pinned version
# (CI, currently 0.16.1) together with mcuhome's.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
